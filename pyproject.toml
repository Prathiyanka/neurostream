[project]
name = "neurostream"
version = "0.1.0"
description = "Real-time EEG streaming and classification platform (research/portfolio project, not a medical device)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["scripts", "services", "ml"]
explicit_package_bases = true
mypy_path = ["services/common", "services/ingest", "services/replayer", "ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["scripts", "services/ingest", "services/replayer", "ml"]
markers = [
  "integration: needs running infrastructure (docker compose up). Deselect with -m 'not integration'.",
]

[tool.ruff.lint.isort]
known-first-party = ["neurostream_common", "neurostream_ml", "ingest", "replayer", "download_data", "tests"]
