[project]
name = "neurostream"
version = "0.1.0"
description = "Real-time EEG streaming and classification platform (research/portfolio project, not a medical device)"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
  "integration: needs running infrastructure (docker compose up). Deselect with -m 'not integration'.",
]
