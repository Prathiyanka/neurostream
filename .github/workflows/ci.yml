name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neurostream
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: neurostream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neurostream" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://neurostream:ci-password@localhost:5432/neurostream
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy)
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration"
      - name: Integration tests
        run: pytest -m integration

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Unit and component tests (Vitest)
        run: npm test
      - name: Production build
        run: npx vite build

  # The whole system in Docker (synthetic signal: CI has no EEG dataset), then one browser
  # smoke test through the dashboard.
  e2e:
    runs-on: ubuntu-latest
    needs: [python, dashboard]
    steps:
      - uses: actions/checkout@v5
      - name: Start the stack
        run: docker compose up -d --build --wait
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install Playwright
        working-directory: dashboard
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Smoke test (Playwright)
        working-directory: dashboard
        run: npm run e2e
      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: dashboard/test-results
