name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neurostream
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: neurostream
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U neurostream" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: postgresql://neurostream:ci-password@localhost:5432/neurostream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (mypy)
        run: mypy
      - name: Unit tests
        run: pytest -m "not integration"
      - name: Integration tests
        run: pytest -m integration

  # dashboard build job is added in Phase 6, when dashboard/ has a package.json
