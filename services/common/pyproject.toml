[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurostream-common"
version = "0.1.0"
description = "Code shared by NeuroStream services and the ML pipeline (schemas, windowing, codecs)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.7"]

[tool.setuptools]
packages = ["neurostream_common"]

[tool.setuptools.package-data]
neurostream_common = ["py.typed"]
