server {
    listen 8080;
    root /usr/share/nginx/html;

    # Resolve "api" through Docker's DNS at request time, not once at startup: if the API
    # container is recreated with a new IP, nginx follows it. (A literal host in
    # proxy_pass would be resolved once and kept forever.)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    # Fail fast while the API is down; the browser retries (the WebSocket client backs off).
    proxy_connect_timeout 3s;

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
    # Hashed asset names: cache for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # REST: /api/x -> http://api:8000/x
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }
    # Live feed (WebSocket upgrade). Long read timeout: the stream is quiet between messages.
    location /ws/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 1h;
    }
}
