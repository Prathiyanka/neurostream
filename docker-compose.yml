# Infrastructure + the services built so far. More services are added phase by phase.
name: neurostream

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurostream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-neurostream}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence so stream entries survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${INGEST_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy

  # Stateless inference workers. Scale out with:  docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL: ${MODEL:-eegnet-motor-1.0.1}
      ORT_THREADS: ${ORT_THREADS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Healthy while this container's worker heartbeat key exists (it has a 5 s TTL).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket,sys,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); sys.exit(0 if r.exists('ns:worker:%s-1' % socket.gethostname()) else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  # Device simulator, run as its own service ("an external device"): the API starts and
  # stops replays over HTTP. Load tests use its command-line mode in separate containers:
  #   docker compose run --rm replayer --url ws://ingest:8001/ws/device --data-dir /data --subjects 1 2
  replayer:
    build:
      context: .
      dockerfile: services/replayer/Dockerfile
    command: ["serve"]
    volumes:
      - ./data:/data:ro
    environment:
      INGEST_URL: ws://ingest:8001/ws/device
      DATA_DIR: /data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${REPLAYER_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
    depends_on:
      ingest:
        condition: service_healthy

  # One-shot: apply database migrations, then exit. The API waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurostream}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-neurostream}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-neurostream}:${POSTGRES_PASSWORD:-change-me-locally}@postgres:5432/${POSTGRES_DB:-neurostream}
      REDIS_URL: redis://redis:6379/0
      REPLAYER_URL: http://replayer:8002
      MODEL: ${MODEL:-eegnet-motor-1.0.1}
      API_CONSUMER: api-1
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      replayer:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
