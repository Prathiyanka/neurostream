# Infrastructure + the services built so far. More services are added phase by phase.
name: neurostream

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neurostream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: ${POSTGRES_DB:-neurostream}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # AOF persistence so stream entries survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    build:
      context: .
      dockerfile: services/ingest/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${INGEST_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy

  # Stateless inference workers. Scale out with:  docker compose up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MODEL: ${MODEL:-eegnet-motor-1.0.1}
      ORT_THREADS: ${ORT_THREADS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # Healthy while this container's worker heartbeat key exists (it has a 5 s TTL).
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket,sys,redis; r=redis.Redis.from_url(os.environ['REDIS_URL']); sys.exit(0 if r.exists('ns:worker:%s-1' % socket.gethostname()) else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy

  # On-demand device simulator (not started by `up`; the API will drive it in Phase 5):
  #   docker compose run --rm replayer --subjects 1 2 --speed 1
  replayer:
    profiles: ["replay"]
    build:
      context: .
      dockerfile: services/replayer/Dockerfile
    command: ["--url", "ws://ingest:8001/ws/device", "--data-dir", "/data", "--subjects", "1"]
    volumes:
      - ./data:/data:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      ingest:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
